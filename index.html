    <!-- Structured Data (JSON-LD) for LocalBusiness & Brand -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BeautySalon",
        "name": "Nayé Cosmétique",
        "description": "Marque de cosmétiques naturels et soins capillaires et corporels faits à Niamey, Niger.",
        "slogan": "La beauté au naturel",
        "telephone": "+22799818108",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Niamey",
          "addressCountry": "NE"
        },
        "priceRange": "$$",
        "image": "./logo-naye.jpg"
      }
    </script>
    <script>
      // Détection automatique pour GitHub Pages :
      // Si le site est déployé depuis la racine / sur GitHub Pages,
      // redirection immédiate vers le dossier /docs/ compilé pour éviter la page blanche.
      (function() {
        var host = window.location.hostname;
        var path = window.location.pathname;
        if (host.endsWith('github.io') && !path.includes('/docs')) {
          var target = path.replace(/\/+$/, '') + '/docs/' + window.location.search + window.location.hash;
          window.location.replace(target);
        }
      })();
    </script>
